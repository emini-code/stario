        init() {
          this.catalog = [];

          if (Array.isArray(window.QUIZ_FILE_LIST) && window.QUIZ_FILE_LIST.length > 0) {

          if (this.catalog.length === 0) {

            this.catalog.push({

            });

          this.renderList();

        async ensureItemLoaded(item) {
          if (item.data) return item.data;
          if (!item.file) return null;
          try {
            const res = await fetch('quiz/' + encodeURIComponent(item.file));
            if (!res.ok) throw new Error('fetch failed');
            const code = await res.text();
            const fn = new Function(code + '; return typeof quizData !== "undefined" ? quizData : null;');
            const parsed = fn();
            if (parsed) item.data = parsed;
          } catch (e) {
            // file:// 환경 대응: 동적 script 태그 폴백
            try {
              await new Promise((resolve) => {
                window.quizData = undefined;
                const sc = document.createElement('script');
                sc.src = 'quiz/' + item.file;
                sc.onload = () => {
                  if (window.quizData) item.data = JSON.parse(JSON.stringify(window.quizData));
                  sc.remove();
                  resolve();
                };
                sc.onerror = () => { sc.remove(); resolve(); };
                document.head.appendChild(sc);
              });
            } catch (err) {}
          }
          return item.data;
        },

        addLocalFiles(fileList) {
          const files = Array.from(fileList || []);
          if (!files.length) return;
          let loadedCount = 0;
          files.forEach((file) => {
            const reader = new FileReader();
            reader.onload = () => {
              try {
                const code = String(reader.result || '');
                const fn = new Function(code + '; return typeof quizData !== "undefined" ? quizData : null;');
                const parsed = fn();
                if (parsed) {
                  const title = file.name.replace(/\.js$/i, '');
                  const exist = this.catalog.find((c) => c.title === title);
                  if (exist) {
                    exist.data = parsed;
                    exist.selected = true;
                  } else {
                    this.catalog.push({
                      id: 'upload_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                      title,
                      file: file.name,
                      data: parsed,
                      selected: true
                    });
                  }
                  loadedCount++;
                }
              } catch (err) {
                showToast(`[${file.name}] 파일을 해석할 수 없습니다.`, 'warn');
              }
              this.renderList();
              if (loadedCount === files.length) {
                showToast(`📚 ${loadedCount}개 퀴즈 파일이 목록에 추가되었습니다!`, 'success');
              }
            };
            reader.readAsText(file, 'utf-8');
          });
        },

        async buildMergedQuizData() {
          const selectedItems = this.catalog.filter((c) => c.selected);
          const merged = { required: [], easy: [], medium: [], hard: [] };
          const titles = [];

          for (const item of selectedItems) {
            const data = await this.ensureItemLoaded(item);
            if (!data) continue;
            titles.push(item.title);
            ['required', 'easy', 'medium', 'hard'].forEach((cat) => {
              if (Array.isArray(data[cat])) {
                data[cat].forEach((q) => merged[cat].push(q));
              }
            });
          }
          return { merged, titles };
        },

          players.forEach((pl) => {
            if (!pl.alive) return;
            rctx.fillStyle = pl.stageId === 'black_hole' ? '#e879f9' : '#38bdf8';
            rctx.beginPath();
            rctx.arc(cx + (pl.x || 0) * sc, cy + (pl.y || 0) * sc, 3.5, 0, Math.PI * 2);
            rctx.fill();
          });
        },

          // 같은 방 친구들 실시간 동기화
          this.playersListener = (pSnap) => {
            const allP = pSnap.val() || {};
            const list = Object.values(allP);
            document.getElementById('roomPlayerCount').textContent = `${list.length}명`;
            document.getElementById('roomPlayerList').innerHTML = list.map((pl) => `
              <span class="px-3 py-1 rounded-full text-xs font-bold ${pl.id === this.myId ? 'bg-emerald-500/25 border border-emerald-400/60 text-emerald-200' : 'bg-slate-800 border border-slate-600 text-slate-200'}">
                ${pl.id === this.myId ? '⭐ ' : '👤 '}${pl.name}
              </span>
            `).join('');

            // 원격 학생 맵 업데이트
            const seen = new Set();
            list.forEach((pl) => {
              if (pl.id === this.myId) return;
              seen.add(pl.id);
              const existing = gameState.remotePlayers.get(pl.id);
              if (existing) {
                existing.name = pl.name;
                existing.targetX = pl.x || 0;
                existing.targetY = pl.y || 0;
                existing.mass = pl.mass || 30;
                existing.stageId = pl.stageId || 'dust';
                existing.alive = !!pl.alive;
                existing.invuln = pl.invuln || 0;
                existing.updatedAt = pl.updatedAt || Date.now();
              } else {
                gameState.remotePlayers.set(pl.id, {
                  id: pl.id,
                  isPlayer: false,
                  isRemotePlayer: true,
                  name: pl.name || '학생',
                  x: pl.x || 0,
                  y: pl.y || 0,
                  targetX: pl.x || 0,
                  targetY: pl.y || 0,
                  mass: pl.mass || 30,
                  stageId: pl.stageId || 'dust',
                  alive: !!pl.alive,
                  invuln: pl.invuln || 0,
                  updatedAt: pl.updatedAt || Date.now()
                });
              }
            });
            gameState.remotePlayers.forEach((_, key) => {
              if (!seen.has(key)) gameState.remotePlayers.delete(key);
            });
          };
          this.roomRef.child('players').on('value', this.playersListener);

          // 방 상태(WAITING -> PLAYING -> ENDED) 감지
          this.metaListener = (mSnap) => {
            const meta = mSnap.val();
            if (!meta) return;
            this.roomIncludeBots = meta.includeBots !== false;
            const prevStatus = this.lastStatus;
            this.lastStatus = meta.status;

            if (meta.status === 'PLAYING' && prevStatus !== 'PLAYING') {
              const elapsed = meta.startedAt ? (Date.now() - meta.startedAt) / 1000 : 0;
              gameState.matchDurationSec = Math.max(30, (meta.duration || 900) - elapsed);

              }
            }
          };
          this.roomRef.child('meta').on('value', this.metaListener);
